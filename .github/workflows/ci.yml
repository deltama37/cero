name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wasmtime
        run: ./scripts/install-wasmtime.sh

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go test
        run: make test
